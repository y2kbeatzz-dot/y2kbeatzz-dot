name: Build Nintendo Switch NRO

on:
  push:
    branches: [ crystalspotify-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Switch libraries
        run: |
          dkp-pacman -Sy --needed --noconfirm switch-curl switch-jansson switch-zlib

      - name: Build NRO
        env:
          DEVKITPRO: /opt/devkitpro
        run: |
          make -j2
          test -f CrystalSpotify.nro

      - name: Make SD-card package
        run: |
          mkdir -p dist/switch/CrystalSpotify
          cp CrystalSpotify.nro dist/switch/CrystalSpotify/CrystalSpotify.nro
          cp release/switch/CrystalSpotify/spotify.cfg.example dist/switch/CrystalSpotify/spotify.cfg.example
          cp tools/SETUP-SPOTIFY.ps1 dist/SETUP-SPOTIFY.ps1
          cp tools/SETUP-SPOTIFY.cmd dist/SETUP-SPOTIFY.cmd

      - name: Upload NRO artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalSpotify-Switch
          path: dist/
