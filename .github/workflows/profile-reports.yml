name: Refresh profile reports
on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"
  push:
    paths:
      - "scripts/profile_cards.py"
      - ".github/workflows/profile-reports.yml"
permissions:
  contents: write
concurrency:
  group: profile-reports
  cancel-in-progress: false
jobs:
  reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/profile_cards.py
      - name: Save reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/language-report.svg assets/public-projects.svg
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public profile reports"
            git pull --rebase
            git push
          fi
